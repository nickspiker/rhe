[package]
name = "rhe"
version = "0.1.1"
edition = "2024"
default-run = "rhe"
description = "Rhe — from Greek ῥέω (to flow). A first-principles stenography engine using temporal hand ordering."
license = "MPL-2.0"
repository = "https://github.com/nickspiker/rhe"
homepage = "https://github.com/nickspiker/rhe"
documentation = "https://github.com/nickspiker/rhe"
readme = "README.md"
keywords = ["stenography", "chording", "phonetic", "typing", "input"]
categories = ["command-line-utilities"]
exclude = [
    "data/en_freq.txt",
    "data/cmudict.dict",
    "data/brown_corpus.txt.zst",
    "data/*.py",
    "tutor_debug.log",
    "target/*",
]

[dependencies]
ureq = "2"
zstd = "0.13"
tray-icon = "0.22"
winit = "0.30.12"
softbuffer = "0.4"
cosmic-text = "0.14.2"
png = "0.17"
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1.5"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
rdev = { version = "0.5", features = ["unstable_grab"] }
core-graphics = "0.24"
core-foundation = "0.10"
foreign-types = "0.5"
wgpu = { version = "28", default-features = false, features = ["metal"] }
pollster = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
xkbcommon = "0.9"
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
rdev = { version = "0.5", features = ["unstable_grab"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
